<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Garage Center AI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="logo">GC<span>AI</span></div>
      <div>
        <h1>Garage Center AI</h1>
        <p>GPT + Claude في سؤال واحد</p>
      </div>
    </header>

    <section class="card">
      <label for="question">اكتب الحالة أو السؤال</label>
      <textarea id="question" rows="7" placeholder="اكتب الحالة أو السؤال"></textarea>
<input id="imageInput" type="file" accept="image/*" />
<button id="analyze">تحليل بواسطة العملاقين</button>

      <div id="status" class="status"></div>
    </section>

    <section id="result" class="hidden">
      <article class="card final">
        <h2>🏁 الحكم النهائي</h2>
        <div id="finalText" class="answer"></div>
      </article>

      <details class="card">
        <summary>رأي GPT</summary>
        <div id="gptText" class="answer"></div>
      </details>

      <details class="card">
        <summary>رأي Claude</summary>
        <div id="claudeText" class="answer"></div>
      </details>
    </section>

    <footer>GARAGE CENTER • ALJABRI</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
